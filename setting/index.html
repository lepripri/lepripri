<!doctype html>
<html><head><title>paramètres généraux | milliminutes</title><title>paramètres généraux | milliminutes</title><style>html, body {background-color: #fcb1e3;width: 100%;width: 600px; height: 100%; margin: 0px} ::backdrop {background: none} dialog {background: #fcb1e3;border-color: #ff0000;border-style: solid;} dialog.message {display: flex;align-items: center;justify-content: center;flex-direction: column; padding-block-start: 0px;} dialog > img[src="https://milliminutes.github.io/milliminutes/icons/Warning.png"] {width: 1em; height: 1em; display: block}</style><style>* {font-family: arial} h1 {text-align: center; display: block; margin: 0px; width: -webkit-fill-available; font-size: 40px;} p {font-size: 20px;} button, a{background-color: #ffffff;border-color: #FF0000;border-style: solid;border-width: 3px;padding-inline: 7px;padding-block: 5px;font-family: arial;font-size: 20px;font-weight: bold;cursor: pointer;outline: none !important;text-decoration: none;color: #000000;}button:hover, button:focus, a:hover, a:focus{font-size: 22px;translate: -8px 0px;margin-inline-end: -30px}button[not-button] {border-style: none;background: none;font-family: revert;cursor: revert;font-size: revert;translate: revert;}</style><style>tablelist {width: 100%; width: -webkit-fill-available; display: flex; flex-direction: column; margin-block: 8px; border-block-start-style: solid; line {display: flex; flex-direction: row; border-block-end-style: solid; textline, actionline {display: flex; align-items: center; width: 50%;padding: 8px; * {font-size: 13px !important; padding: 2px;border-radius: 6px;translate: 0px 0px !important; margin-inline-end: 0px !important;}} actionline {border-inline-start-style: solid; justify-content: center; align-items: center; justify-items: center;}}}</style>
    <style>
        /* Styles de base */
        html, body {
            background-color: #fcb1e3;
            width: 100%;
            max-width: 1002px; /* Ajusté pour correspondre à ta table */
            margin: 0 auto;
            font-family: arial;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 40px;
        }

        /* Dialogues / Messages */
        ::backdrop { background: none; }
        dialog {
            background: #fcb1e3;
            border: 3px solid #ff0000;
        }
        dialog.message {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        dialog img { width: 1em; height: 1em; display: block; }

        /* Boutons et Liens */
        button, a {
            background-color: #ffffff;
            border: 3px solid #FF0000;
            padding: 5px 7px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: #000;
            display: inline-block;
        }
        button:hover, a:hover {
            font-size: 22px;
            transform: translateX(-8px);
        }

        /* Liste en tableau custom */
        tablelist {
            display: flex;
            flex-direction: column;
            border: 1px solid #ff0000;
            background: rgba(255,255,255,0.1);
        }
        line {
            display: flex;
            border-bottom: 1px solid #ff0000;
        }
        textline, actionline {
            padding: 12px;
            width: 50%;
            display: flex;
            align-items: center;
        }
        actionline {
            border-left: 1px solid #ff0000;
            justify-content: center;
        }
        input {
            padding: 5px;
            border: 1px solid #ff0000;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>paramètres généraux | milliminutes</h1>

    <tablelist>
        <line>
            <textline>installer les extensions nécessaires (95% gratuit*)</textline>
            <actionline><button name="instal">installer gratuitement . . .</button></actionline>
        </line>
        <line>
            <textline>milliminutes extension store (gratuit)</textline>
            <actionline><button name="extensions">ouvrir . . .</button></actionline>
        </line>
        <line>
            <textline>thème</textline>
            <actionline>
                <select name="theme" style="text-align: center;">
                    <option value="rose" style="background-color: #fcb1e3;">rose</option>
                    <option value="claire" style="background-color: #ffffff; color: #000">claire</option>
                    <option value="sombre" style="background-color: #000000; color: #fff">sombre</option>
                    <option value="system">system</option>
                    <option value="personaliser">personnaliser</option>
                </select>
            </actionline>
        </line>
        <line>
            <textline>AIKey</textline>
            <actionline>
                <input id="AIKey" type="password" placeholder="placez une clé IA Gemini" style="width: 100%;">
            </actionline>
        </line>
        <line>
            <textline>connexion/déconnexion</textline>
            <actionline><button id="btnAuth">aller</button></actionline>
        </line>
    </tablelist>

    <script type="module" src="https://milliminutes.github.io/module.js"></script>
    <script src="https://milliminutes.github.io/allPages.js"></script>
    
    <script>
        // --- CHARGEMENT DES PARAMÈTRES ---
        if(localStorage.theme) document.querySelector('[name="theme"]').value = localStorage.theme;
document.querySelector('#AIKey').addEventListener("change", async (e) => {
    const key = e.target.value;
    const user = milliminutes.auth.currentUser;

    if (user) {
        // On enregistre la clé dans le document de l'utilisateur
            await milliminutes.db.collection("users").doc(user.uid).set({
                AIKey: key
            }, { merge: true });
            if (!milliminutes.isConnected) {
                showMassage("Clé sauvegardée sur ton compte milliminutes !");
            } else {
                showMassage("Connecte-toi pour sauvegarder la clé en ligne.");
                // Backup local au cas où
                localStorage.setItem("AIKey", key);
            }
        });

        // --- ÉVÉNEMENTS ---
        document.querySelector('[name="instal"]').addEventListener("click", () => {
            showMassage('le contenu est indisponible');
        });

        document.querySelector('[name="theme"]').addEventListener("change", (e) => {
            localStorage.setItem("theme", e.target.value);
            // Ici tu pourrais appeler une fonction pour appliquer le thème instantanément
        });

        document.querySelector('#AIKey').addEventListener("input", (e) => {
            localStorage.setItem("AIKey", e.target.value);
        });

        document.querySelector('[name="extensions"]').addEventListener('click', () => {
            window.open("https://milliminutes.github.io/instal/extension/", "_self");
        });
    </script>


</body></html>
