<!doctype html>
<html><head><title>general settings | lepripri</title><style>html, body {background-color: #fcb1e3;width: 100%;width: 600px; height: 100%; margin: 0px} ::backdrop {background: none} dialog {background: #fcb1e3;border-color: #ff0000;border-style: solid;} dialog.message {display: flex;align-items: center;justify-content: center;flex-direction: column; padding-block-start: 0px;} dialog > img[src="https://lepripri.github.io/lepripri/icons/Warning.png"] {width: 1em; height: 1em; display: block}</style><style>* {font-family: arial} h1 {text-align: center; display: block; margin: 0px; width: -webkit-fill-available; font-size: 40px;} p {font-size: 20px;} button, a{background-color: #ffffff;border-color: #FF0000;border-style: solid;border-width: 3px;padding-inline: 7px;padding-block: 5px;font-family: arial;font-size: 20px;font-weight: bold;cursor: pointer;outline: none !important;text-decoration: none;color: #000000;}button:hover, button:focus, a:hover, a:focus{font-size: 22px;translate: -8px 0px;margin-inline-end: -30px}button[not-button] {border-style: none;background: none;font-family: revert;cursor: revert;font-size: revert;translate: revert;}</style><style>tablelist {width: 100%; width: -webkit-fill-available; display: flex; flex-direction: column; margin-block: 8px; border-block-start-style: solid; line {display: flex; flex-direction: row; border-block-end-style: solid; textline, actionline {display: flex; align-items: center; width: 50%;padding: 8px; * {font-size: 13px !important; padding: 2px;border-radius: 6px;translate: 0px 0px !important; margin-inline-end: 0px !important;}} actionline {border-inline-start-style: solid; justify-content: center; align-items: center; justify-items: center;}}}</style>
    <style>
        /* Styles de base */
        html, body {
            background-color: #fcb1e3;
            width: 100%;
            max-width: 1002px; /* Ajusté pour correspondre à ta table */
            margin: 0 auto;
            font-family: arial;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 40px;
        }

        /* Dialogues / Messages */
        ::backdrop { background: none; }
        dialog {
            background: #fcb1e3;
            border: 3px solid #ff0000;
        }
        dialog.message {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        dialog img { width: 1em; height: 1em; display: block; }

        /* Boutons et Liens */
        button, a {
            background-color: #ffffff;
            border: 3px solid #FF0000;
            padding: 5px 7px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: #000;
            display: inline-block;
        }
        button:hover, a:hover {
            font-size: 22px;
            transform: translateX(-8px);
        }

        /* Liste en tableau custom */
        tablelist {
            display: flex;
            flex-direction: column;
            border: 1px solid #ff0000;
            background: rgba(255,255,255,0.1);
        }
        line {
            display: flex;
            border-bottom: 1px solid #ff0000;
        }
        textline, actionline {
            padding: 12px;
            width: 50%;
            display: flex;
            align-items: center;
        }
        actionline {
            border-left: 1px solid #ff0000;
            justify-content: center;
        }
        input {
            padding: 5px;
            border: 1px solid #ff0000;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>general settings</h1>
    <tablelist>
        <line>
            <textline>language</textline>
            <actionline><button id="language" onclick="localStorage.removeItem('lang')">change</button></actionline>
        </line>
    </tablelist>
</body></html>
